<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دليلك إلى مشروع جبين السكني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#1f4d3a; --green-dark:#173d2e; --gold:#b8963e; --gold-light:#d9c89a;
    --cream:#f1efe9; --card:#ffffff; --text:#2b2b2b; --muted:#7a7a7a; --line:#e6e3dc;
    --soft:#fbf7ec; --hover:#f6f4ee; --active:#ecefe7; --glow:#f6e9d0; --shadow:rgba(0,0,0,.04);
    --cta1:#1b4a37; --cta2:#2a5e49; --cta-sub:#cfdcd4; --logo-bg:#ffffff;
  }
  :root[data-theme="dark"]{
    --green:#8fcfae; --green-dark:#a9dfc2; --gold:#d4b25f; --gold-light:#6b5a2e;
    --cream:#121614; --card:#1c2320; --text:#e6e8e4; --muted:#9aa39d; --line:#2c3531;
    --soft:#242a22; --hover:#232b27; --active:#27352d; --glow:#1d2a24; --shadow:rgba(0,0,0,.35);
    --cta1:#17382b; --cta2:#1f4a39; --cta-sub:#b7cbc0; --logo-bg:#f4f1ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Tajawal',system-ui,sans-serif;background:var(--cream);color:var(--text);min-height:100vh;transition:background .3s,color .3s;
       background-image:radial-gradient(ellipse 60% 420px at 50% -40px, var(--glow) 0%, transparent 70%);}
  .wrap{max-width:1620px;margin:0 auto;padding:16px 16px 40px}

  /* top bar: language + theme */
  .bar-top{display:flex;justify-content:flex-end;gap:10px;margin-bottom:14px}
  .pill{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:8px 16px;font-weight:700;font-size:15px;color:var(--green);box-shadow:0 2px 14px var(--shadow);transition:.2s}
  .pill:hover{border-color:var(--gold)}
  .pill svg{width:18px;height:18px;color:var(--gold)}

  /* header */
  .logos{display:flex;justify-content:center;align-items:center;gap:30px;margin-bottom:34px;flex-wrap:wrap}
  .logo{background:var(--logo-bg);border-radius:22px;padding:26px 40px;min-width:280px;max-width:490px;flex:1;height:160px;
        display:flex;align-items:center;justify-content:center;box-shadow:0 2px 14px var(--shadow)}
  .logo img{max-height:110px;max-width:100%;object-fit:contain}
  .divider{width:1px;height:90px;background:var(--line)}
  h1{text-align:center;color:var(--green);font-size:clamp(28px,4.2vw,52px);font-weight:800;margin-bottom:6px}
  .sub{text-align:center;color:var(--muted);font-size:clamp(14px,1.4vw,20px)}
  .bar{width:104px;height:4px;background:var(--gold-light);margin:28px auto 42px;border-radius:2px}

  /* search */
  .search{background:var(--card);border-radius:28px;padding:22px 34px;display:flex;align-items:center;gap:18px;box-shadow:0 2px 14px var(--shadow);margin-bottom:32px}
  .search svg{flex:none}
  .search input{border:0;outline:0;font:inherit;font-size:22px;width:100%;color:var(--text);background:transparent}
  .search input::placeholder{color:var(--muted)}

  /* generic card section */
  .section{background:var(--card);border-radius:24px;padding:34px 44px 18px;margin-bottom:24px;box-shadow:0 2px 14px var(--shadow)}
  .section-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:8px;gap:16px}
  .section-head h2{color:var(--green);font-size:clamp(24px,2.6vw,36px);font-weight:800}
  .section-head span{color:var(--muted);font-size:17px}

  /* categories index */
  .cats{padding-bottom:26px}
  .cats .section-head{border-bottom:0;padding-bottom:0;margin-bottom:4px}
  .cats .hint{color:var(--muted);font-size:15px;margin-bottom:18px}
  .cats ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 24px}
  .cat{min-width:0;display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;cursor:pointer;color:var(--green);font-weight:700;font-size:18px;transition:.15s;border:1px solid transparent}
  .cat .ic{color:var(--gold);display:flex;flex:none}
  .cat .ic svg{width:22px;height:22px}
  .cat .t{flex:1;border-bottom:1px solid transparent}
  .cat:hover{background:var(--hover)}
  .cat:hover .t{border-bottom-color:var(--gold-light)}
  .cat.active{background:var(--active);border-color:var(--gold-light)}
  .cat .chev{color:var(--gold);font-size:13px}

  /* tools */
  .tools{display:flex;gap:10px;align-items:center;color:var(--line);font-size:15px;margin:14px 4px 4px}
  .tools button{all:unset;cursor:pointer;color:var(--gold);font-weight:700}
  .tools button:hover{text-decoration:underline}

  /* top questions */
  .top5 .section-head{border-bottom:0;padding-bottom:6px;margin-bottom:0}
  .tq{border-bottom:1px solid var(--line)}
  .tq:last-child{border-bottom:0}
  .tq button{all:unset;display:flex;align-items:center;gap:14px;width:100%;cursor:pointer;padding:20px 4px;font-size:clamp(17px,1.5vw,21px);font-weight:500;color:var(--text)}
  .tq button:hover{color:var(--green)}
  .tq .chev{color:var(--gold);font-size:14px;transition:.25s;flex:none;display:inline-block}
  .tq.open .chev{transform:rotate(90deg)}
  .tq .card{display:none;margin:0 4px 22px;background:var(--soft);border:1px solid var(--gold-light);border-inline-start:5px solid var(--gold);border-radius:16px;padding:20px 24px}
  .tq.open .card{display:block}
  .tq .card h3{color:var(--green);font-size:19px;font-weight:800;margin-bottom:10px}
  .tq .card p{color:var(--text);opacity:.85;font-size:17px;line-height:1.9}
  .tq.all button{color:var(--green);font-weight:700;flex-wrap:wrap;gap:10px 14px}
  .tq.all small{color:var(--muted);font-weight:400;font-size:14px}
  .tq .card .cat-link{display:inline-block;margin-top:12px;color:var(--gold);font-weight:700;font-size:15px;cursor:pointer;border-bottom:1px solid var(--gold-light)}

  /* faq */
  .q{border-bottom:1px solid var(--line)}
  .q:last-child{border-bottom:0}
  .q button{all:unset;display:flex;justify-content:space-between;align-items:center;width:100%;cursor:pointer;padding:26px 4px;font-size:clamp(17px,1.5vw,23px);color:var(--text);gap:16px}
  .q button:hover{color:var(--green)}
  .q .chev{color:var(--gold);font-size:14px;transition:.25s;flex:none;width:18px;text-align:center}
  .q.open .chev{transform:rotate(180deg)}
  .a{display:none;padding:0 4px 28px;color:var(--text);opacity:.85;font-size:18px;line-height:1.9}
  .q.open .a{display:block}
  .a.pending{opacity:.65}
  .badge{display:inline-block;background:var(--soft);color:var(--gold);border:1px solid var(--gold-light);border-radius:30px;padding:2px 14px;font-size:14px;font-weight:700;margin-inline-end:8px;vertical-align:middle}
  .badge.ok{background:var(--active);color:var(--green);border-color:var(--gold-light)}
  mark{background:#fbe9b8;color:#2b2b2b;padding:0 2px;border-radius:3px}
  .empty{text-align:center;color:var(--muted);padding:50px 10px;font-size:20px}
  .back{all:unset;cursor:pointer;display:inline-block;color:var(--green);font-weight:700;font-size:17px;margin:0 4px 16px;padding:8px 18px;border-radius:12px;background:var(--card);border:1px solid var(--gold-light)}
  .back:hover{border-color:var(--gold)}

  /* info banner */
  .info{background:var(--soft);border:1px solid var(--gold-light);border-radius:22px;padding:22px 32px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:28px}
  .info p{color:var(--green);font-size:clamp(16px,1.4vw,21px);font-weight:700}
  .info p small{display:block;color:var(--muted);font-weight:400;font-size:15px;margin-top:4px}
  .info-btns{display:flex;gap:12px;flex-wrap:wrap}
  .info a{color:#fff;background:var(--cta1);text-decoration:none;font-weight:700;padding:13px 26px;border-radius:12px;white-space:nowrap;font-size:17px}
  .info a:hover{background:var(--cta2)}
  .info a.alt{background:#b8963e}
  .info a.alt:hover{background:#a8872f}

  /* gallery */
  .gallery{padding-bottom:30px}
  .gallery .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:22px}
  .gallery .grid a{display:block;border-radius:16px;overflow:hidden;aspect-ratio:3/2;background:var(--cream)}
  .gallery .grid img{width:100%;height:100%;object-fit:cover;transition:.3s;display:block}
  .gallery .grid a:hover img{transform:scale(1.04)}
  .gallery-cta{display:inline-block;margin-top:20px;color:var(--green);font-weight:700;text-decoration:none;border-bottom:2px solid var(--gold-light);padding-bottom:3px}
  .gallery-cta:hover{border-color:var(--gold)}

  /* back to top */
  .top{position:fixed;inset-inline-start:18px;bottom:18px;width:52px;height:52px;border-radius:50%;border:0;background:var(--cta1);color:#fff;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;visibility:hidden;transform:translateY(12px);transition:.25s;z-index:50;display:flex;align-items:center;justify-content:center}
  .top svg{width:24px;height:24px}
  .top.show{opacity:1;visibility:visible;transform:none}
  .top:hover{background:var(--cta2)}

  /* cta */
  .cta{background:linear-gradient(90deg,var(--cta1),var(--cta2));border-radius:24px;padding:46px 48px;display:flex;justify-content:space-between;align-items:center;gap:24px;color:#fff;margin-top:34px;flex-wrap:wrap}
  .cta h3{font-size:clamp(24px,2.6vw,36px);font-weight:800;margin-bottom:8px}
  .cta p{color:var(--cta-sub);font-size:clamp(15px,1.4vw,22px)}
  .cta a{background:#b8963e;color:#fff;text-decoration:none;font-weight:700;font-size:clamp(17px,1.5vw,24px);padding:18px 36px;border-radius:14px;white-space:nowrap}
  .cta a:hover{background:#a8872f}
  .foot{text-align:center;color:var(--muted);font-size:15px;margin-top:40px;line-height:1.8}
  .foot-links{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:22px}
  .foot-link{display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--card);border:1px solid var(--gold-light);border-radius:16px;color:var(--green);text-decoration:none;font-weight:700;font-size:18px;box-shadow:0 2px 14px var(--shadow);transition:.2s}
  .foot-link svg{width:26px;height:26px;color:var(--gold);flex:none}
  .foot-link small{display:block;color:var(--muted);font-weight:400;font-size:14px;margin-top:2px}
  .foot-link:hover{transform:translateY(-2px);border-color:var(--gold)}
  [dir="ltr"] .foot-link svg:last-child{transform:scaleX(-1)}
  @media(max-width:600px){
    .section{padding:24px 18px 10px}.cta{padding:30px 22px}.search input{font-size:18px}
    .logos{flex-wrap:nowrap;gap:12px;margin-bottom:26px}
    .logo{min-width:0;flex:1;height:96px;padding:12px 14px;border-radius:16px}
    .logo img{max-height:70px}
    .divider{height:56px;flex:none}
  }
</style>
</head>

/* أهم الاستفسارات: [معرّف التصنيف، ترتيب السؤال داخله بدءاً من 0] */
const TOP = [['exec',0],['exec',1],['money',0],['handover',1],['warranty',1]];

/* ---------------------------------------------------------------- */
let lang='ar', active='all', query='';
try{ lang = localStorage.getItem('lang')==='en' ? 'en' : 'ar'; }catch(e){}
const T = ()=>UI[lang];
const Q = i => lang==='en' ? (i.qe||i.q) : i.q;
const A = i => lang==='en' ? (i.ae||i.a) : i.a;
const CT = c => lang==='en' ? (c.te||c.title) : c.title;

const catsEl=document.getElementById('cats'), faqEl=document.getElementById('faq'), topEl=document.getElementById('top5');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hl(s){ if(!query) return esc(s); const r=new RegExp('('+query.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'); return esc(s).replace(r,'<mark>$1</mark>'); }
function badge(i){ const a=A(i); return `<span class="badge ${a?'ok':''}">${a?T().approved:T().pending}</span>`; }
function answer(i){ const a=A(i); return a?hl(a):T().pendingText; }

function renderStatic(){
  document.documentElement.lang = lang; document.documentElement.dir = lang==='en'?'ltr':'rtl';
  document.title = T().title;
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=T()[el.dataset.t]);
  document.getElementById('search').placeholder = T().search;
  document.getElementById('langLabel').textContent = T().lang;
  document.getElementById('themeLabel').textContent = document.documentElement.dataset.theme==='dark' ? T().light : T().dark;
}

function renderCats(){
  catsEl.innerHTML = `<div class="section-head"><h2>${T().index}</h2></div><p class="hint">${T().indexHint}</p><ul>` +
    DATA.map(c=>`<li class="cat ${c.id===active?'active':''}" data-id="${c.id}"><span class="chev">❯</span><span class="ic">${ICONS[c.icon]}</span><span class="t">${CT(c)}</span></li>`).join('') + `</ul>`;
  catsEl.querySelectorAll('.cat').forEach(el=>el.onclick=()=>{active=el.dataset.id;renderCats();renderFaq();faqEl.scrollIntoView({behavior:'smooth',block:'start'});});
}

function renderTop(){
  const items = TOP.map(([id,i])=>{const c=DATA.find(c=>c.id===id); return {...c.items[i], cat:c};});
  topEl.innerHTML = `<div class="section-head"><h2>${T().top}</h2><span>${T().topSub}</span></div>
    <div class="tools"><button data-x="1">${T().expand}</button>|<button data-x="0">${T().collapse}</button></div>` +
    items.map(i=>`<div class="tq"><button><span class="chev">❯</span>${esc(Q(i))}</button>
      <div class="card"><h3>${esc(Q(i))}</h3><p>${badge(i)} ${answer(i)}</p>
        <span class="cat-link" data-id="${i.cat.id}">${T().seeCat(CT(i.cat))}</span></div></div>`).join('') +
    `<div class="tq all"><button id="allq"><span class="chev">❯</span><b>${T().allQ}</b><small>${T().allQSub(DATA.reduce((s,c)=>s+c.items.length,0))}</small></button></div>`;
  topEl.querySelectorAll('.tq button:not(#allq)').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
  document.getElementById('allq').onclick=()=>{active='allq';renderCats();renderFaq();faqEl.scrollIntoView({behavior:'smooth',block:'start'});};
  topEl.querySelectorAll('.tools button').forEach(b=>b.onclick=()=>topEl.querySelectorAll('.tq').forEach(t=>t.classList.toggle('open',b.dataset.x==='1')));
  topEl.querySelectorAll('.cat-link').forEach(l=>l.onclick=()=>{active=l.dataset.id;renderCats();renderFaq();faqEl.scrollIntoView({behavior:'smooth',block:'start'});});
}

function renderFaq(){
  const q = query.trim().toLowerCase();
  const overview = active==='all' && !q;
  topEl.style.display = overview ? '' : 'none';
  if(overview){ faqEl.innerHTML=''; return; }
  const cats = DATA.filter(c=>active==='all'||active==='allq'||c.id===active)
    .map(c=>({...c, items:c.items.filter(i=>!q||Q(i).toLowerCase().includes(q)||A(i).toLowerCase().includes(q))}))
    .filter(c=>c.items.length);
  const backBtn = `<button class="back" id="back">${T().back}</button>`;
  if(!cats.length){ faqEl.innerHTML=(active!=='all'?backBtn:'')+`<div class="section"><p class="empty">${T().noResults}</p></div>`; bindBack(); return; }
  faqEl.innerHTML = (active!=='all' ? backBtn : '') + cats.map(c=>`
    <div class="section" data-id="${c.id}">
      <div class="section-head"><h2>${CT(c)}</h2><span>${T().plural(c.items.length)}</span></div>
      <div class="tools"><button data-x="1">${T().expand}</button>|<button data-x="0">${T().collapse}</button></div>
      ${c.items.map(i=>`
        <div class="q ${q?'open':''}">
          <button>${hl(Q(i))}<span class="chev">▼</span></button>
          <div class="a ${A(i)?'':'pending'}">${badge(i)}${answer(i)}</div>
        </div>`).join('')}
    </div>`).join('');
  faqEl.querySelectorAll('.q button').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
  faqEl.querySelectorAll('.tools button').forEach(b=>b.onclick=()=>b.closest('.section').querySelectorAll('.q').forEach(x=>x.classList.toggle('open',b.dataset.x==='1')));
  bindBack();
}
function bindBack(){ const b=document.getElementById('back'); if(b) b.onclick=()=>{active='all';renderCats();renderFaq();topEl.scrollIntoView({behavior:'smooth',block:'start'});}; }

function renderAll(){ renderStatic(); renderCats(); renderTop(); renderFaq(); }

/* اللغة */
document.getElementById('langBtn').onclick=()=>{ lang = lang==='ar'?'en':'ar'; try{localStorage.setItem('lang',lang);}catch(e){} renderAll(); };

/* الوضع الداكن */
function applyTheme(t){
  document.documentElement.dataset.theme = t;
  document.getElementById('iconMoon').style.display = t==='dark'?'none':'';
  document.getElementById('iconSun').style.display = t==='dark'?'':'none';
  document.getElementById('themeLabel').textContent = t==='dark' ? T().light : T().dark;
}
let theme='light';
try{ theme = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); }catch(e){}
applyTheme(theme);
document.getElementById('themeBtn').onclick=()=>{ theme = theme==='dark'?'light':'dark'; try{localStorage.setItem('theme',theme);}catch(e){} applyTheme(theme); };

/* البحث والعودة للأعلى */
document.getElementById('search').addEventListener('input',e=>{query=e.target.value;renderFaq();});
const topBtn=document.getElementById('top');
addEventListener('scroll',()=>topBtn.classList.toggle('show',scrollY>500),{passive:true});
topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});

renderAll();
</script>
